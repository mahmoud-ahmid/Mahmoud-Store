<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الدخول | محمود إلكترو</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"></head>
<body class="bg-dark text-light d-flex align-items-center justify-content-center vh-100">
<div class="card bg-secondary bg-opacity-25 border-secondary p-4 rounded-4" style="max-width: 400px; width: 100%;">
<div class="text-center mb-3"><i class="fa-solid fa-user-lock fs-1 text-info mb-2"></i>
<h4 class="fw-bold">تسجيل الدخول</h4><p class="text-secondary small">أدخل بريدك الإلكتروني وكلمة المرور</p></div>
{% if error %}<div class="alert alert-danger py-2 small">{{ error }}</div>{% endif %}
<form method="POST"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<div class="mb-3"><label class="form-label small">البريد الإلكتروني</label>
<input type="email" name="email" class="form-control bg-dark text-light border-secondary" required autocomplete="email"></div>
<div class="mb-3"><label class="form-label small">كلمة المرور</label>
<input type="password" name="password" class="form-control bg-dark text-light border-secondary" required autocomplete="current-password"></div>
<button type="submit" class="btn btn-info w-100 rounded-3 fw-bold">دخول</button></form>
<p class="text-secondary small text-center mt-3 mb-0">ليس لديك حساب؟ <a href="/register" class="text-info">إنشاء حساب جديد</a></p>
</div></body></html>
