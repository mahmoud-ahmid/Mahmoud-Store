<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل دخول المالك | محمود إلكترو</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-light d-flex align-items-center justify-content-center vh-100">
    <div class="card bg-secondary bg-opacity-25 border-secondary p-4 rounded-4 text-center" style="max-width: 400px; width: 100%;">
        <i class="fa-brands fa-github fs-1 text-info mb-3"></i>
        <h4 class="fw-bold mb-3">التحقق من مالك المتجر</h4>
        <p class="text-secondary small">أدخل اسم حسابك على GitHub للتحقق من صلاحيات الأدمن</p>
        
        {% if error %}
            <div class="alert alert-danger py-2 small">{{ error }}</div>
        {% endif %}

        <form method="POST">
            <div class="mb-3">
                <input type="text" name="username" class="form-control bg-dark text-light border-secondary text-center" placeholder="GitHub Username (e.g. mahmoud-ahmid)" required>
            </div>
            <button type="submit" class="btn btn-info w-100 rounded-3 fw-bold">تأكيد الحساب والتحقق</button>
        </form>
    </div>
</body>
</html>
