<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل بـ Google | محمود إلكترو</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-light d-flex align-items-center justify-content-center vh-100">
    <div class="card bg-secondary bg-opacity-25 border-secondary p-4 rounded-4" style="max-width: 400px; width: 100%;">
        <div class="text-center mb-3">
            <i class="fa-brands fa-google fs-1 text-danger mb-2"></i>
            <h4 class="fw-bold">تسجيل الدخول بحساب Google</h4>
            <p class="text-secondary small">أدخل بياناتك لحفظ المفضلات والتعليقات</p>
        </div>

        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="mb-3">
                <label class="form-label small">الاسم الكامل</label>
                <input type="text" name="name" class="form-control bg-dark text-light border-secondary" placeholder="اسمك" required>
            </div>
            <div class="mb-3">
                <label class="form-label small">البريد الإلكتروني (Google Email)</label>
                <input type="email" name="email" class="form-control bg-dark text-light border-secondary" placeholder="example@gmail.com" required>
            </div>
            <button type="submit" class="btn btn-danger w-100 rounded-3 fw-bold"><i class="fa-brands fa-google me-1"></i> متابعة التسجيل</button>
        </form>
    </div>
</body>
</html>
